# このファイルを config/loop-engineering.ini へコピーし、ローカル環境に合わせて編集する。
# config/loop-engineering.ini はGit管理対象外。

[project]
key = sample-project
workspace_path = /absolute/path/to/product-workspace
repository = owner/repository
trunk_branch = main
work_branch_template = loop/work-{issue}
project_owner = owner
project_number = 1
mission_issue =
root_issue =
parent_issue =
integration_work =
label = loop-engineering
authority_refs =
ci_workflow_name = Deterministic CI
improvement_area = Runtime / Infrastructure
issue_level = Work

[self_improvement]
enabled = true
repository = owner/loop-engineering
project_owner = owner
project_number = 1
label = loop-engineering
area = Runtime / Infrastructure
issue_level = Work
authority_refs =

[models]
implementer_provider = codex
implementer_model = default
implementer_profile =
reviewer_provider = openai
reviewer_model = gpt-5.6-terra
reviewer_api_base = https://api.openai.com/v1
reviewer_api_key_env = OPENAI_API_KEY

[local_llm_coder]
endpoint = http://127.0.0.1:8765
production_name =


[review.level.1]
provider = openai
model = gpt-5.6-terra
api_base = https://api.openai.com/v1
credential_env = OPENAI_API_KEY
required = true
timeout_seconds = 1200
context_policy = default
escalation_policy = HUMAN
passes_required = 1

[verification.command.1]
identity = git-diff-check
argv_json = ["git", "diff", "--check", "HEAD"]
working_directory = .
timeout_seconds = 120
required = true

# Production固有testは番号を追加してshellではなくargv配列で指定する。
# [verification.command.2]
# identity = tests
# argv_json = ["python", "-m", "pytest"]
# working_directory = .
# timeout_seconds = 1200
# required = true

[credentials]
github_token_env = GH_TOKEN

[operational_store]
dsn_env = LOOP_POSTGRES_DSN
required = false
driver = host
docker_container =
migration_policy = required

[runtime]
trusted_reviewer_socket_env = LOOP_TRUSTED_REVIEWER_SOCKET
