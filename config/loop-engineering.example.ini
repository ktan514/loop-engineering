# このファイルを config/loop-engineering.ini へコピーし、ローカル環境に合わせて編集する。
# config/loop-engineering.ini はGit管理対象外。

[project]
key = sample-project
workspace_path = /absolute/path/to/product-workspace
repository = owner/repository
trunk_branch = main
work_branch_template = loop/work-{issue}
project_owner = owner
project_number = 1
mission_issue = 1
root_issue =
parent_issue =
integration_work =
label = loop-engineering
authority_refs =
ci_workflow_name = Deterministic CI
improvement_area = Runtime / Infrastructure
issue_level = Work

[self_improvement]
enabled = true
repository = owner/loop-engineering
project_owner = owner
project_number = 1
label = loop-engineering
area = Runtime / Infrastructure
issue_level = Work
authority_refs =

[models]
implementer_provider = codex
implementer_model = default
reviewer_provider = openai
reviewer_model = gpt-5.6-terra
reviewer_api_base = https://api.openai.com/v1
reviewer_api_key_env = OPENAI_API_KEY

[credentials]
github_token_env = GH_TOKEN

[operational_store]
dsn_env = LOOP_POSTGRES_DSN

[runtime]
trusted_reviewer_socket_env = LOOP_TRUSTED_REVIEWER_SOCKET
